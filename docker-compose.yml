services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: jetrun
      POSTGRES_USER: jetrun
      POSTGRES_PASSWORD: jetrun_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jetrun"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://jetrun:jetrun_dev@postgres:5432/jetrun
      REDIS_URL: redis://redis:6379
      ENGINE_URL: http://engine:9001
      WORKER_URL: http://worker:9002
      CACHE_URL: http://cache:9003
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  engine:
    build:
      context: .
      dockerfile: Dockerfile.engine
    ports:
      - "9001:9001"
    environment:
      DATABASE_URL: postgres://jetrun:jetrun_dev@postgres:5432/jetrun
      WORKER_URL: http://worker:9002
      CACHE_URL: http://cache:9003
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    ports:
      - "9002:9002"
    environment:
      CACHE_URL: http://cache:9003
      RUST_LOG: info
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - worker_workspace:/workspace

  cache:
    build:
      context: .
      dockerfile: Dockerfile.cache
    ports:
      - "9003:9003"
    environment:
      REDIS_URL: redis://redis:6379
      CACHE_DIR: /cache
      RUST_LOG: info
    volumes:
      - cache_data:/cache
    depends_on:
      redis:
        condition: service_healthy

  web:
    build:
      context: ./web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    depends_on:
      - gateway

volumes:
  pgdata:
  cache_data:
  worker_workspace:
