upstream jetrun_api {
    server 127.0.0.1:8080;
    keepalive 32;
}

upstream jetrun_web {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;  # Replace with your domain

    # Frontend dashboard
    location / {
        proxy_pass http://jetrun_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API — proxy to gateway
    location /api/ {
        proxy_pass http://jetrun_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Increase timeouts for long-running build operations
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # WebSocket — live build logs
    location /api/v1/ws/ {
        proxy_pass http://jetrun_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;  # Keep WS alive for long builds
    }

    # Health check (no proxy overhead)
    location /health {
        proxy_pass http://jetrun_api;
        proxy_http_version 1.1;
        access_log off;
    }

    # Webhooks — needs raw body for signature verification
    location /api/v1/webhooks/ {
        proxy_pass http://jetrun_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Hub-Signature-256 $http_x_hub_signature_256;
        proxy_set_header X-GitHub-Event $http_x_github_event;
        proxy_set_header X-Gitlab-Token $http_x_gitlab_token;
        proxy_set_header X-Gitlab-Event $http_x_gitlab_event;
        proxy_set_header X-Event-Key $http_x_event_key;

        # Don't buffer — webhooks need fast response
        proxy_buffering off;
    }
}
