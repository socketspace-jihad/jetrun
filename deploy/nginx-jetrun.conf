upstream jetrun_api {
    server 127.0.0.1:8080;
    keepalive 32;
}

upstream jetrun_auth {
    server 127.0.0.1:9004;
    keepalive 16;
}

upstream jetrun_repo {
    server 127.0.0.1:9005;
    keepalive 16;
}

upstream jetrun_web {
    server 127.0.0.1:3000;
    keepalive 16;
}

# ── Frontend: jetrun.devopsinstitute.id ──
server {
    listen 80;
    server_name jetrun.devopsinstitute.id;

    location /_next/static/ {
        alias /home/ubuntu/jetrun/web/.next/standalone/.next/static/;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    location /public/ {
        alias /home/ubuntu/jetrun/web/.next/standalone/public/;
        expires 30d;
        access_log off;
    }

    location / {
        proxy_pass http://jetrun_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── API: api.jetrun.devopsinstitute.id ──
server {
    listen 80;
    server_name api.jetrun.devopsinstitute.id;

    # Auth routes → auth service (port 9004)
    location /api/v1/auth/ {
        proxy_pass http://jetrun_auth;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 30s;

        # CORS
        add_header Access-Control-Allow-Origin "https://jetrun.devopsinstitute.id" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-API-Key" always;
        add_header Access-Control-Allow-Credentials "true" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # WebSocket — live build logs
    location /api/v1/ws/ {
        proxy_pass http://jetrun_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    # Projects → repo service (port 9005)
    location /api/v1/projects {
        proxy_pass http://jetrun_repo;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Builds → repo service (port 9005)
    location /api/v1/builds {
        proxy_pass http://jetrun_repo;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Secrets → repo service (port 9005)
    location /api/v1/secrets {
        proxy_pass http://jetrun_repo;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Webhooks → repo service (port 9005), pass signature headers
    location /api/v1/webhooks/ {
        proxy_pass http://jetrun_repo;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Hub-Signature-256 $http_x_hub_signature_256;
        proxy_set_header X-GitHub-Event $http_x_github_event;
        proxy_set_header X-Gitlab-Token $http_x_gitlab_token;
        proxy_set_header X-Gitlab-Event $http_x_gitlab_event;
        proxy_set_header X-Event-Key $http_x_event_key;
        proxy_buffering off;
    }

    # Everything else → gateway (port 8080)
    location / {
        proxy_pass http://jetrun_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # CORS
        add_header Access-Control-Allow-Origin "https://jetrun.devopsinstitute.id" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-API-Key" always;
        add_header Access-Control-Allow-Credentials "true" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }
}
