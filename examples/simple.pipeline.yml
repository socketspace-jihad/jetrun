name: "Build and Test"
description: "Simple CI pipeline for a Rust project"

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

stages:
  - name: lint
    steps:
      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

  - name: test
    depends_on: [lint]
    steps:
      - name: Run tests
        run: cargo test --workspace
        cache:
          key: "cargo-test-{{ hashFiles('Cargo.lock') }}"
          paths: ["target/"]
          restore_keys: ["cargo-test-"]

  - name: build
    depends_on: [test]
    steps:
      - name: Build release
        run: cargo build --release
        artifacts:
          name: release-binary
          paths: ["target/release/myapp"]
          retention_days: 14
